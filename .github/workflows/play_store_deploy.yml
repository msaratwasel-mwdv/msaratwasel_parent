name: Deploy Parent App to Google Play

on:
  push:
    branches:
      - main
      - master
      - production
  workflow_dispatch:
    inputs:
      target_track:
        description: 'Choose deployment track'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - internal
          - production

jobs:
  deploy:
    name: Build and Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Setup Signing Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/msarat_parent_key.jks
          cat << 'EOF' > android/key.properties
          storePassword=aqs123#@A1223
          keyPassword=aqs123#@A1223
          keyAlias=msarat_parent
          storeFile=../msarat_parent_key.jks
          EOF

      - name: Determine Deployment Track
        id: track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "selected_track=${{ github.event.inputs.target_track }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "selected_track=production" >> $GITHUB_OUTPUT
          else
            echo "selected_track=alpha" >> $GITHUB_OUTPUT
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 10 ))
          flutter build appbundle --release --build-name=1.0.0 --build-number=$BUILD_NUMBER

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.msaratwasel.user
          tracks: ${{ steps.track.outputs.selected_track }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
